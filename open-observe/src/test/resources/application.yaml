spring:
  application:
    name: spring-boot-open-observe
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false

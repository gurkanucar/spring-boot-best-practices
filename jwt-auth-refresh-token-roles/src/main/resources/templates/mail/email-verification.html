<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm your e-mail address</title>
</head>
<body style="margin: 0; padding: 24px; background: #f5f7fa; font-family: Arial, Helvetica, sans-serif; color: #1f2933;">
<div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 24px;">
    <h1 style="font-size: 20px; margin-top: 0;">Confirm your e-mail address</h1>
    <p>Open the link below and press <strong>Confirm my e-mail</strong> to activate your account.</p>
    <p><a th:href="${link}" th:text="${link}" style="color: #2563eb; word-break: break-all;">link</a></p>
    <p style="color: #52606d; font-size: 13px;">
        The link is valid for [[${validMinutes}]] minutes.
        If you did not create an account, you can ignore this mail.
    </p>
</div>
</body>
</html>

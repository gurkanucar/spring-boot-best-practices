<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password</title>
    <style>
        body { margin: 0; padding: 24px; background: #f5f7fa; font-family: Arial, Helvetica, sans-serif; color: #1f2933; }
        .card { max-width: 420px; margin: 40px auto; background: #ffffff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
        h1 { font-size: 20px; margin-top: 0; }
        label { display: block; margin-bottom: 6px; }
        input[type=password] { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 16px; border: 1px solid #cbd2d9; border-radius: 6px; }
        button { background: #2563eb; color: #ffffff; border: 0; border-radius: 6px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
<div class="card">
    <h1>Choose a new password</h1>
    <p class="error" th:if="${error}" th:text="${error}">Error</p>
    <form method="post" th:action="@{/api/auth/reset-password/submit}">
        <input type="hidden" name="token" th:value="${token}">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required>
        <button type="submit">Update password</button>
    </form>
</div>
</body>
</html>

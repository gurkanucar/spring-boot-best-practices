services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reports_jobrunr
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: reports
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - reports-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reports -d reports_jobrunr"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  reports-data:

spring:
  application:
    name: validation
  datasource:
    url: jdbc:h2:mem:validationdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    # Off: a REST API should not hold the persistence context open for the whole request.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

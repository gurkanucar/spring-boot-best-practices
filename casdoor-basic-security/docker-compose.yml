# Casdoor (identity provider) and PostgreSQL for local development. Not a production setup.
#
#   Casdoor (UI + OIDC) : http://localhost:8000   (issuer: http://localhost:8000)
#   PostgreSQL          : localhost:5437          (databases: casdoor, app)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5437 on the host, so it does not clash with other PostgreSQL instances in this repository.
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty volume: creates the "casdoor" and "app" databases.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  casdoor:
    image: casbin/casdoor:latest   # pin a version (e.g. v2.x.y) once you have one that works for you
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: postgres
      dataSourceName: "user=postgres password=postgres host=postgres port=5432 sslmode=disable dbname=casdoor"
      dbName: casdoor
      # ENDPOINT-style origin: the issuer in every token. The app (on the host) and the browser both
      # reach Casdoor at localhost:8000, so the issuer matches issuer-uri in application.yaml.
      origin: http://localhost:8000
      # Seeds the organization, application (client id/secret), roles and users on start.
      initDataFile: /init_data.json
      initDataNewOnly: "true"
    volumes:
      - ./docker/casdoor/init_data.json:/init_data.json:ro
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres-data:

spring:
  application:
    name: quartz-scheduler-shedlock
  datasource:
    url: jdbc:h2:mem:quartzshedlockdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    net.javacrumbs.shedlock: DEBUG

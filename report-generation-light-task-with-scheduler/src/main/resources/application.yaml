spring:
  application:
    name: report-generation-light-task-with-scheduler
  datasource:
    url: jdbc:postgresql://localhost:5434/reports
    username: reports
    password: reports
  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway (db/migration); Hibernate only checks that the mappings match it.
      ddl-auto: validate

server:
  port: 8099

tasks:
  # How often to check the database for new or retryable tasks.
  # This is not a task timeout; the next check starts 2 seconds after the previous poll.
  poll-interval: 2s

  # Total number of tasks that can run concurrently on this application instance.
  # All task types share these 16 workers. Waiting tasks remain PENDING in the database.
  workers: 16

  # Per-type concurrency limits on this instance.
  # These are not reserved workers; each type also shares the total worker limit.
  # Types not listed here may use all available workers.
  # With 2 reports running, up to 14 workers remain for other tasks.
  concurrency:
    REPORT_GENERATION: 2
    # Additional per-type limits; remove an entry to let that type use any free worker.
    EMAIL_SEND: 10
    REPORT_SHARE: 4

  # A claimed task still RUNNING after 20 minutes is considered stuck.
  # Recovery runs once a minute and moves it to PENDING, or DEAD if retries are exhausted.
  # This does not stop the task thread. Set this above the longest legitimate task duration,
  # or a task that is still running may start again. Shared by all task types.
  stuck-after: 20m

  # How long shutdown waits for running tasks; this is not a task timeout.
  shutdown-wait: 60s
  # All capacity limits are per instance: 3 instances allow up to 6 reports and 48 total tasks.
  # instance-id defaults to hostname plus a random suffix and must be unique per instance.

reports:
  # Protects against repeated export clicks: at most 3 requests per user in 10 minutes.
  rate-limit:
    max-requests: 3
    window: 10m

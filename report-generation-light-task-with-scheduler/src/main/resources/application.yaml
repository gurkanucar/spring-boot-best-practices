spring:
  application:
    name: report-generation-light-task-with-scheduler
  datasource:
    url: jdbc:postgresql://localhost:5434/reports
    username: reports
    password: reports
  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway (db/migration); Hibernate only checks that the mappings match it.
      ddl-auto: validate

server:
  port: 8099

tasks:
  # How often each instance looks for due tasks.
  poll-interval: 2s
  # Tasks running at once on this instance; waiting tasks stay PENDING in the database.
  workers: 4
  # A task still RUNNING after this long is treated as crashed and retried (or DEAD).
  # Set it above the longest legitimate task duration.
  stuck-after: 20m

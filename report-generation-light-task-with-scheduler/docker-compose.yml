# Local infrastructure: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: reports-postgres
    environment:
      POSTGRES_DB: reports
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: reports
    ports:
      # 5434 on the host, so it does not clash with a locally installed Postgres on 5432.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reports -d reports"]
      interval: 5s
      timeout: 5s
      retries: 10

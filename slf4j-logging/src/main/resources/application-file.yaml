# Console stays readable; the file contains one JSON object per event.
logging:
  file:
    name: logs/slf4j-logging.log
  structured:
    format:
      file: logstash
  logback:
    rollingpolicy:
      file-name-pattern: '${logging.file.name}.%d{yyyy-MM-dd}.%i.gz'
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
      clean-history-on-start: true
